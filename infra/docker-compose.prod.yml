name: facturelebat-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
    volumes:
      # Rotated log files (backend/src/logging/) outlive container restarts
      # and are readable straight off the VPS's disk — not just through
      # `docker compose logs`, whose retention is Docker's own logging
      # driver, not this app's. See docs/logging.md for where this volume
      # lives on disk and `make logs-files-prod` to tail it.
      - backend_logs:/app/logs

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      - backend
    # No published port: only `caddy` is reachable from outside the compose
    # network, so there's a single place that owns public exposure/TLS.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  # Persists the Let's Encrypt cert/account so it survives `docker compose
  # down`/redeploys — never wipe this with `-v`, or every redeploy re-issues
  # a cert and risks Let's Encrypt's rate limits.
  caddy_data:
  caddy_config:
  backend_logs:
