server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Phase 29: Universal Links (iOS) / App Links (Android) — both files
    # ship from frontend/public/.well-known (copied verbatim into the
    # build), but nginx's default MIME map has no entry for an
    # extension-less apple-app-site-association, and Apple's own docs call
    # for it being served as application/json specifically. Set explicitly
    # rather than trusting the default_type fallback.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }
    location = /.well-known/assetlinks.json {
        default_type application/json;
    }

    # nginx:alpine's bundled mime.types has no .mjs entry, so it falls back
    # to the server-wide default_type (application/octet-stream). Harmless
    # for most assets, but pdf-canvas-viewer.component.ts loads
    # pdf.worker.min.mjs as an ES module Worker, and browsers refuse to
    # execute a module script served with a non-JS MIME type — silently
    # breaking the PDF preview on exactly the platforms that need this
    # canvas fallback (desktop Safari, iOS, Capacitor native), while Chrome
    # desktop's native iframe viewer never requests this file and stayed
    # unaffected.
    location ~ \.mjs$ {
        default_type application/javascript;
    }

    # Angular SPA: let the router handle any path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
