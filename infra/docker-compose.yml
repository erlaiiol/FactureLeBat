name: facturele-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    # entrypoint.dev.sh execs into `npm run start:dev`, but npm itself is
    # still PID 1 underneath the Nest CLI's watch process — npm's SIGTERM
    # forwarding to that process tree is inconsistent enough that `docker
    # compose down` regularly has to wait out the full stop_grace_period
    # (10s default) and SIGKILL instead of stopping cleanly. `init: true`
    # runs the container under tini as PID 1, which does forward/reap
    # correctly regardless of what npm does.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # http://10.0.2.2 is the Android emulator's fixed alias for the host
      # machine (see frontend/scripts/run-android.sh / `make android-dev`,
      # `make android-demo`) — added unconditionally since it's meaningless
      # outside an emulator's own virtual network, nothing else can ever
      # send it as an Origin.
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT},http://10.0.2.2
      PORT: 3000
      # Unset/false for every normal `make dev` — `make demo` (Makefile) is
      # the only caller that sets DEMO_MODE=true in its own shell env before
      # `docker compose up`, turning on the one-click demo-login endpoints
      # (see backend/src/auth/guards/demo-mode-enabled.guard.ts).
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - '${BACKEND_PORT}:3000'
    volumes:
      - ../backend:/app
      - /app/node_modules
      - /app/generated
      # Compose reuses an anonymous volume's prior content across `up
      # --build` by default, so a schema.prisma change alone won't refresh
      # this one — the freshly-`prisma generate`d client built into the new
      # image gets shadowed by the old volume, producing stale-type errors
      # that look like a Prisma/TS bug. `make dev`/`make demo` pass `-V`
      # (--renew-anon-volumes) specifically so this volume gets rebuilt
      # every time; don't drop that flag from the Makefile.
      # NOT excluding dist/ here: nest-cli.json's deleteOutDir rmdir's the
      # whole dist/ folder on every rebuild, and Docker refuses to rmdir a
      # volume's own mount point (EBUSY) — tried it, it crash-loops the
      # container. dist/ stays on the regular bind mount.

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: dev
    restart: unless-stopped
    # Same signal-forwarding rationale as backend's init: true above — npx
    # sits between PID 1 and the actual ng serve process.
    init: true
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT}:4200'
    volumes:
      - ../frontend:/app
      - /app/node_modules
      # frontend/android and frontend/ios are native Gradle/Xcode projects
      # (make android / make ios) that `ng serve` never touches, but
      # `../frontend:/app` above pulls the whole directory along anyway —
      # including their Gradle/Pods/DerivedData caches once those targets
      # have actually been run, easily hundreds of MB to GB+ that has no
      # reason to be synced into the dev container. .angular is ng serve's
      # own build cache, meaningless outside the container it was written
      # in, so excluding it too drops another source of constant write
      # traffic across the mount.
      - /app/android
      - /app/ios
      - /app/.angular

volumes:
  postgres_data:
