<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed square variant for Apple/Android, which apply their own corner mask -->

  <rect width="512" height="512" fill="#1A1A1A"/>

  <!-- Faint document silhouette -->
  <rect x="166" y="86" width="180" height="300" rx="20" fill="none" stroke="#6B6B63" stroke-opacity="0.5" stroke-width="3"/>

  <!-- Dog-ear fold, top-right of document -->
  <polygon points="310,86 346,86 346,122" fill="#1A1A1A" stroke="#6B6B63" stroke-opacity="0.5" stroke-width="3"/>
  <polygon points="310,86 346,122 310,122" fill="#CC5500"/>

  <!-- F monogram overlapping the sheet -->
  <rect x="200" y="140" width="44" height="192" rx="8" fill="#FF6B00"/>
  <rect x="200" y="140" width="130" height="44" rx="8" fill="#FF6B00"/>
  <rect x="200" y="234" width="100" height="44" rx="8" fill="#FF6B00"/>
</svg>
