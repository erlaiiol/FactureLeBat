<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>FactureLe</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Same CSP as index.html's, except connect-src also allows
    localhost:3000 — only `ng serve` (dev build configuration, see
    angular.json's `index` override) ever uses this file. Production and
    the Capacitor mobile bundle both keep index.html's stricter 'self' as
    published, since their backend is genuinely same-origin (Caddy/nginx
    proxying in prod, capacitor.config.ts's server.hostname trick on
    mobile — see that file's own comment) — only plain local dev has the
    frontend and backend on two different origins (:4200 and :3000). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' blob: http://localhost:3000; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#FF6B00" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FF6B00" />
  </head>
  <body>
    <app-root>
      <!-- Static pre-boot placeholder: Angular clears and replaces this
           markup with App's own template the moment it bootstraps, so it
           only ever shows during the gap before the JS bundle evaluates.
           Kept to plain inline CSS (no Tailwind classes) since the compiled
           stylesheet, while normally already loaded by the time this paints,
           isn't guaranteed to be on a slow connection. -->
      <div
        style="
          display: flex;
          min-height: 100vh;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background: #fbfbf9;
        "
      >
        <img
          src="/android-chrome-192x192.png"
          width="64"
          height="64"
          alt=""
          style="border-radius: 16px; animation: boot-pulse 1.6s ease-in-out infinite"
        />
      </div>
      <style>
        @media (prefers-color-scheme: dark) {
          app-root > div {
            background: #171714 !important;
          }
        }
        @keyframes boot-pulse {
          0%,
          100% {
            opacity: 0.55;
          }
          50% {
            opacity: 1;
          }
        }
      </style>
    </app-root>
  </body>
</html>
