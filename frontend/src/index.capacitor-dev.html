<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>FactureLe</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Same CSP as index.html's, except connect-src also allows the local
    backend on :3000 — see environment.capacitor-dev.ts's own comment for why
    the WebView's origin (server.hostname, port 80 implicit) and the local
    API's origin (:3000) are NOT actually same-origin here, unlike real prod
    (Caddy/nginx proxy) or a store build (still same-origin, this file isn't
    used there). REPLACE_WITH_CAPACITOR_LOCAL_HOST is patched by
    scripts/run-android.sh (dev mode) with the same LAN IP passed to
    capacitor.config.ts/network_security_config.xml/environment.capacitor-dev.ts,
    then reverted via `git checkout` on script exit — ships inert here. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' blob: http://REPLACE_WITH_CAPACITOR_LOCAL_HOST:3000; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#FF6B00" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FF6B00" />
  </head>
  <body>
    <app-root>
      <!-- Static pre-boot placeholder: Angular clears and replaces this
           markup with App's own template the moment it bootstraps, so it
           only ever shows during the gap before the JS bundle evaluates.
           Kept to plain inline CSS (no Tailwind classes) since the compiled
           stylesheet, while normally already loaded by the time this paints,
           isn't guaranteed to be on a slow connection. -->
      <div
        style="
          display: flex;
          min-height: 100vh;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background: #fbfbf9;
        "
      >
        <img
          src="/android-chrome-192x192.png"
          width="64"
          height="64"
          alt=""
          style="border-radius: 16px; animation: boot-pulse 1.6s ease-in-out infinite"
        />
      </div>
      <style>
        @media (prefers-color-scheme: dark) {
          app-root > div {
            background: #171714 !important;
          }
        }
        @keyframes boot-pulse {
          0%,
          100% {
            opacity: 0.55;
          }
          50% {
            opacity: 1;
          }
        }
      </style>
    </app-root>
  </body>
</html>
