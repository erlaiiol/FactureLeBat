<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>FactureLe</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Phase 22: the web deployment gets its CSP from infra/Caddyfile's
    response header (see docs/deployment.md), but a Capacitor app's WebView
    serves this HTML from the local bundle, which never passes through
    Caddy — no header CSP applies there at all otherwise. A meta-tag CSP is
    the one form that's enforced regardless of how the HTML was delivered,
    so this is a second, portable copy of the same policy, not a
    replacement for the header (header-only directives like
    frame-ancestors/Permissions-Policy can't be expressed here and stay
    server-side only). Keep the two in sync if either ever changes.
    This file is also the base for index.dev.html (angular.json's
    `development` build configuration swaps to it — see that file's own
    comment): frontend and backend are same-origin everywhere this file
    actually ships (prod via Caddy/nginx, mobile via capacitor.config.ts's
    server.hostname trick), so connect-src 'self' is correct here — it's
    only plain `ng serve` (:4200 vs :3000) that needs the relaxed copy.
    connect-src also needs `blob:`: WebKit (unlike Chromium) enforces
    connect-src on fetch() against a same-page-created blob: URL, which is
    exactly how pdf-canvas-viewer.component.ts reads the PDF bytes back out
    to hand them to pdf.js — without it, Safari/iOS/Capacitor block the
    fetch outright ("Refused to connect to blob:..."), even though the PDF
    request itself succeeded. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#FF6B00" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FF6B00" />
  </head>
  <body>
    <app-root>
      <!-- Static pre-boot placeholder: Angular clears and replaces this
           markup with App's own template the moment it bootstraps, so it
           only ever shows during the gap before the JS bundle evaluates.
           Kept to plain inline CSS (no Tailwind classes) since the compiled
           stylesheet, while normally already loaded by the time this paints,
           isn't guaranteed to be on a slow connection. -->
      <div
        style="
          display: flex;
          min-height: 100vh;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background: #fbfbf9;
        "
      >
        <img
          src="/android-chrome-192x192.png"
          width="64"
          height="64"
          alt=""
          style="border-radius: 16px; animation: boot-pulse 1.6s ease-in-out infinite"
        />
      </div>
      <style>
        @media (prefers-color-scheme: dark) {
          app-root > div {
            background: #171714 !important;
          }
        }
        @keyframes boot-pulse {
          0%,
          100% {
            opacity: 0.55;
          }
          50% {
            opacity: 1;
          }
        }
      </style>
    </app-root>
  </body>
</html>
