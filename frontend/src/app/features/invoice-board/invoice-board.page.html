<div class="mx-auto max-w-4xl p-4">
  <h1 class="font-heading uppercase tracking-wide mb-6 text-2xl font-bold text-ink">
    Mes documents
  </h1>

  <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center">
    <input
      [value]="search()"
      (input)="onSearchInput($any($event.target).value)"
      type="text"
      placeholder="Rechercher un client…"
      class="rounded-lg border border-line px-4 py-3 text-lg"
    />
    <input
      [value]="dateFrom()"
      (input)="onDateFromInput($any($event.target).value)"
      type="date"
      aria-label="Du"
      class="rounded-lg border border-line px-4 py-3 text-ink"
    />
    <input
      [value]="dateTo()"
      (input)="onDateToInput($any($event.target).value)"
      type="date"
      aria-label="Au"
      class="rounded-lg border border-line px-4 py-3 text-ink"
    />
  </div>

  @if (loading()) {
    @if (showSkeleton()) {
      <div class="flex flex-col gap-2 overflow-hidden rounded-xl border border-line bg-surface">
        @for (row of [0, 1, 2, 3]; track row) {
          <div class="anim-skeleton h-14 border-b border-line/60 last:border-b-0"></div>
        }
      </div>
    }
  } @else {
    @if (errorMessage(); as message) {
      <p class="mb-4 font-medium text-danger">{{ message }}</p>
    }

    <div
      #tbodyRef
      class="anim-preview-in overflow-x-auto rounded-xl border border-line bg-surface shadow-sm"
    >
      <table class="w-full min-w-[44rem] text-sm">
        <thead>
          <tr class="border-b border-line text-left text-ink-soft">
            <th class="font-medium">
              <button
                type="button"
                (click)="cycleStatusFilter()"
                title="Cliquer pour filtrer par statut"
                class="flex w-full items-center px-4 py-3 text-left hover:text-ink"
              >
                @if (statusFilter() === 'ALL') {
                  <span class="font-medium">Statut</span>
                } @else {
                  <app-badge [variant]="statusFilterVariant()" tone="solid">
                    {{ statusFilterLabel() }}
                  </app-badge>
                }
              </button>
            </th>
            <th class="font-medium">
              <button
                type="button"
                (click)="sortBy('date')"
                class="flex w-full items-center gap-1 px-4 py-3 text-left font-medium hover:text-ink"
              >
                Date
                @if (sortIndicator('date'); as direction) {
                  <app-icon-chevron-down [size]="12" [rotated]="direction === 'asc'" />
                }
              </button>
            </th>
            <th class="font-medium">
              <button
                type="button"
                (click)="sortBy('number')"
                class="flex w-full items-center gap-1 px-4 py-3 text-left font-medium hover:text-ink"
              >
                Nom
                @if (sortIndicator('number'); as direction) {
                  <app-icon-chevron-down [size]="12" [rotated]="direction === 'asc'" />
                }
              </button>
            </th>
            <th class="font-medium">
              <button
                type="button"
                (click)="sortBy('customerName')"
                class="flex w-full items-center gap-1 px-4 py-3 text-left font-medium hover:text-ink"
              >
                Client
                @if (sortIndicator('customerName'); as direction) {
                  <app-icon-chevron-down [size]="12" [rotated]="direction === 'asc'" />
                }
              </button>
            </th>
            <th class="px-4 py-3 text-right font-medium">Total</th>
            <th class="px-4 py-3 text-right font-medium">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (item of rows(); track item.id) {
            <app-invoice-list-row
              [invoice]="item"
              [attachedFactureNumber]="attachedFactureOf(item)?.number ?? null"
              [highlighted]="isHighlighted(item)"
              [converting]="convertingDevisId() === item.id"
              [sharing]="sharingInvoiceId() === item.id"
              [statusMenuOpen]="isStatusMenuOpen(item.id)"
              [actionsMenuOpen]="isActionsMenuOpen(item.id)"
              (convertToFacture)="convertDevis(item)"
              (createFromDevis)="createFromDevis(item)"
              (toggleHighlight)="toggleHighlight(item)"
              (toggleStatusMenu)="toggleStatusMenu(item.id)"
              (toggleActionsMenu)="toggleActionsMenu(item.id)"
              (setPaid)="markPaid(item)"
              (setCancelled)="cancelInvoice(item)"
              (setNonPayee)="moveToNonPayee(item)"
              (share)="onShare(item)"
            />
          }
        </tbody>
      </table>

      @if (rows().length === 0) {
        <p class="p-6 text-center text-sm text-ink-soft">
          Aucun document ne correspond à ces filtres.
        </p>
      }
    </div>
  }

  <app-invoice-due-date-modal
    [invoice]="dueDateModalInvoice()"
    (confirmed)="onDueDateConfirmed($event)"
    (skipped)="onDueDateSkipped()"
  />

  <app-send-invoice-email-modal
    [invoice]="emailModalInvoice()"
    (closed)="closeEmailModal()"
    (sent)="onEmailSent($event)"
  />
</div>
