<h1 class="font-heading uppercase tracking-wide mb-6 text-2xl font-bold text-ink">
  {{ isEditing ? 'Modifier le client' : 'Nouveau client' }}
</h1>

@if (loading()) {
  <p class="text-ink-soft">Chargement…</p>
}

<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="flex flex-col gap-4"
  [class.hidden]="loading()"
>
  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Nom</span>
    <input
      formControlName="name"
      type="text"
      class="rounded-lg border border-line px-4 py-3 text-lg"
    />
    <app-field-hint text="Le nom de ce client, tel qu'il apparaîtra sur ses factures." />
  </label>

  <div class="flex flex-col gap-3 rounded-lg border border-line p-4">
    <label appTourAnchor="customer-professional-checkbox" class="flex items-center gap-2">
      <input
        type="checkbox"
        formControlName="isProfessional"
        (click)="onProfessionalCheckboxClick()"
        class="h-5 w-5"
      />
      <span class="text-sm font-medium text-ink">Client professionnel</span>
    </label>
    <app-field-hint
      text="Ce client achète pour son entreprise, pas à titre personnel — se coche automatiquement dès que vous renseignez une raison sociale ou un SIRET, mais reste modifiable à tout moment (un indépendant sans SIRET renseigné peut rester professionnel)."
    />

    @if (form.value.isProfessional) {
      <label class="flex flex-col gap-1">
        <span class="text-sm font-medium text-ink">Nom de l'entreprise</span>
        <input
          formControlName="companyName"
          type="text"
          class="rounded-lg border border-line px-4 py-3 text-lg"
        />
        <app-field-hint text="La raison sociale de ce client, si elle diffère de son nom." />
      </label>

      <label class="flex flex-col gap-1">
        <span class="text-sm font-medium text-ink">SIRET</span>
        <input
          formControlName="siret"
          type="text"
          inputmode="numeric"
          maxlength="14"
          class="rounded-lg border border-line px-4 py-3 text-lg"
        />
        <app-field-hint
          text="Facultatif — uniquement si ce client facture lui-même en tant que professionnel."
        />
      </label>
    }
  </div>

  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Adresse</span>
    <input
      formControlName="address"
      type="text"
      class="rounded-lg border border-line px-4 py-3 text-lg"
    />
    <app-field-hint
      text="L'adresse à facturer, reprise automatiquement sur ses prochaines factures."
    />
  </label>

  <div class="flex gap-3">
    <label class="flex flex-1 flex-col gap-1">
      <span class="text-sm font-medium text-ink">Email</span>
      <input
        formControlName="email"
        type="email"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      />
      <app-field-hint text="Facultatif — pour lui envoyer ses factures." />
    </label>
    <label class="flex flex-1 flex-col gap-1">
      <span class="text-sm font-medium text-ink">Téléphone</span>
      <input
        formControlName="phone"
        type="tel"
        autocomplete="off"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      />
      <app-field-hint text="Facultatif — pour le recontacter facilement." />
    </label>
  </div>

  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Notes</span>
    <textarea
      formControlName="description"
      rows="3"
      class="rounded-lg border border-line px-4 py-3 text-lg"
    ></textarea>
    <app-field-hint
      text="Facultatif — tout ce qui vous aide à vous souvenir de ce client (repères, contexte…) ; utilisé aussi pour le retrouver dans la recherche."
    />
  </label>

  @if (errorMessage(); as message) {
    <p class="text-center font-medium text-danger">{{ message }}</p>
  }
  @if (catalogLimitReached()) {
    <app-big-button type="button" variant="primary" tone="solid" (click)="goToSubscribe()">
      Voir les offres
    </app-big-button>
  } @else {
    <app-big-button type="submit" [disabled]="saving()">
      {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
    </app-big-button>
  }
</form>
