<h1 class="font-heading uppercase tracking-wide mb-6 text-2xl font-bold text-ink">
  {{ isEditing ? 'Modifier la prestation' : 'Nouvelle prestation' }}
</h1>

@if (loading()) {
  <p class="text-ink-soft">Chargement…</p>
}

<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="flex flex-col gap-4"
  [class.hidden]="loading()"
>
  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Nom de la prestation</span>
    <input
      formControlName="name"
      type="text"
      placeholder="Ex : Main-d’œuvre pose parquet"
      class="rounded-lg border border-line px-4 py-3 text-lg"
    />
    <app-field-hint text="Le nom affiché quand vous choisissez cette prestation sur une facture." />
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Code prestation</span>
    <input
      formControlName="code"
      type="text"
      placeholder="Ex : MO-POSE"
      class="rounded-lg border border-line px-4 py-3 text-lg"
    />
    <app-field-hint text="Facultatif — votre propre référence pour cette prestation." />
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Description</span>
    <textarea
      formControlName="description"
      rows="3"
      class="rounded-lg border border-line px-4 py-3 text-lg"
    ></textarea>
    <app-field-hint text="Facultatif — des précisions internes sur cette prestation." />
  </label>

  <div class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Tarification</span>
    <div class="flex overflow-hidden rounded-lg border border-line">
      <button
        type="button"
        (click)="setPricingMode('FIXED')"
        [class.bg-primary]="!isPercentageMode()"
        [class.text-primary-fg]="!isPercentageMode()"
        class="flex-1 px-4 py-3 text-sm font-semibold"
      >
        Prix fixe
      </button>
      <button
        type="button"
        (click)="setPricingMode('PERCENTAGE')"
        [class.bg-primary]="isPercentageMode()"
        [class.text-primary-fg]="isPercentageMode()"
        class="flex-1 px-4 py-3 text-sm font-semibold"
      >
        Pourcentage
      </button>
    </div>
    <app-field-hint
      text="Pourcentage : un « Marge 30% » réutilisable sur chaque facture, calculé automatiquement sur le montant de la facture — plus besoin de le recalculer à la main."
    />
  </div>

  @if (!isPercentageMode()) {
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Prix (€)</span>
      <input
        formControlName="priceEuros"
        type="number"
        step="0.01"
        min="0"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      />
      <app-field-hint
        text="Le montant total de cette prestation, sera pré-rempli sur vos factures."
      />
    </label>
  } @else {
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Pourcentage (%)</span>
      <input
        formControlName="percentage"
        type="number"
        step="0.01"
        min="0.01"
        max="100"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      />
      <app-field-hint
        text="Le montant ajouté à la facture sera calculé automatiquement : ce pourcentage du total des lignes et prestations visibles."
      />
    </label>
  }

  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Visibilité par défaut sur une facture</span>
    <select
      formControlName="defaultVisibility"
      class="rounded-lg border border-line px-4 py-3 text-lg"
    >
      <option value="VISIBLE">Visible — sa propre ligne sur la facture</option>
      <option value="REDISTRIBUTED">Répartie — masquée, ajoutée aux autres lignes</option>
    </select>
    <app-field-hint
      text="Ce réglage ne fait que pré-remplir le choix lors de l’ajout à une facture — modifiable à chaque fois."
    />
  </label>

  @if (errorMessage(); as message) {
    <p class="text-center font-medium text-danger">{{ message }}</p>
  }

  <app-big-button type="submit" [disabled]="saving()">
    {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
  </app-big-button>
</form>
