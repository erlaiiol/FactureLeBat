<div class="mx-auto flex max-w-sm flex-col gap-6 py-12">
  <a routerLink="/" class="mx-auto flex items-center" aria-label="Retour à l'accueil FactureLe">
    <img src="/android-chrome-192x192.png" alt="" width="40" height="40" class="rounded-lg" />
  </a>

  <h1 class="font-heading text-center text-2xl font-bold uppercase tracking-wide text-ink">
    Créer un compte
  </h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Email</span>
      <input
        formControlName="email"
        type="email"
        autocomplete="email"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Mot de passe</span>
      <input
        formControlName="password"
        type="password"
        autocomplete="new-password"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      />
      <span class="text-xs text-ink-soft">8 caractères minimum.</span>
    </label>

    <label class="flex items-start gap-2">
      <input
        formControlName="acceptTerms"
        type="checkbox"
        class="mt-1 h-5 w-5 rounded border-line"
      />
      <span class="text-sm text-ink">
        J'accepte les <a routerLink="/cgu" class="underline">CGU</a> et la
        <a routerLink="/confidentialite" class="underline">politique de confidentialité</a>.
      </span>
    </label>

    <label class="flex items-start gap-2">
      <input
        formControlName="newsletterOptIn"
        type="checkbox"
        class="mt-1 h-5 w-5 rounded border-line"
      />
      <span class="text-sm text-ink">Je souhaite recevoir la newsletter FactureLe.</span>
    </label>

    @if (errorMessage(); as message) {
      <p class="text-center font-medium text-danger">{{ message }}</p>
    }

    <app-big-button type="submit" [disabled]="saving()">
      {{ saving() ? 'Création…' : 'Créer mon compte' }}
    </app-big-button>
  </form>

  <a
    [href]="googleLoginUrl"
    class="flex items-center justify-center gap-2 rounded-xl border border-line px-6 py-3 text-sm font-semibold text-ink hover:bg-secondary-subtle"
  >
    Continuer avec Google
  </a>

  <p class="text-center text-sm text-ink-soft">
    Déjà un compte ?
    <a routerLink="/connexion" class="font-medium underline">Se connecter</a>
  </p>
</div>
