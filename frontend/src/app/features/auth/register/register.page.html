<div class="mx-auto flex max-w-sm flex-col gap-6 py-12">
  <a routerLink="/" class="mx-auto flex items-center" aria-label="Retour à l'accueil FactureLe">
    <img src="/android-chrome-192x192.png" alt="" width="40" height="40" class="rounded-lg" />
  </a>

  <h1 class="font-heading text-center text-2xl font-bold uppercase tracking-wide text-ink">
    Créer un compte
  </h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Email</span>
      <input
        formControlName="email"
        type="email"
        autocomplete="email"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Mot de passe</span>
      <div class="relative">
        <input
          formControlName="password"
          [type]="passwordVisible() ? 'text' : 'password'"
          autocomplete="new-password"
          class="w-full rounded-lg border border-line px-4 py-3 pr-12 text-lg"
        />
        <button
          type="button"
          (click)="passwordVisible.set(!passwordVisible())"
          [attr.aria-label]="
            passwordVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
          "
          class="absolute inset-y-0 right-0 flex items-center px-3 text-ink-soft"
        >
          @if (passwordVisible()) {
            <app-icon-eye-off />
          } @else {
            <app-icon-eye />
          }
        </button>
      </div>
      @if (
        form.controls.password.invalid &&
        (form.controls.password.dirty || form.controls.password.touched)
      ) {
        <span class="text-xs font-medium text-danger">
          8 caractères minimum, avec au moins une majuscule et un chiffre.
        </span>
      } @else {
        <span class="text-xs text-ink-soft">
          8 caractères minimum, avec au moins une majuscule et un chiffre.
        </span>
      }
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Confirmer le mot de passe</span>
      <div class="relative">
        <input
          formControlName="confirmPassword"
          [type]="confirmPasswordVisible() ? 'text' : 'password'"
          autocomplete="new-password"
          class="w-full rounded-lg border border-line px-4 py-3 pr-12 text-lg"
        />
        <button
          type="button"
          (click)="confirmPasswordVisible.set(!confirmPasswordVisible())"
          [attr.aria-label]="
            confirmPasswordVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
          "
          class="absolute inset-y-0 right-0 flex items-center px-3 text-ink-soft"
        >
          @if (confirmPasswordVisible()) {
            <app-icon-eye-off />
          } @else {
            <app-icon-eye />
          }
        </button>
      </div>
      @if (
        form.errors?.['passwordMismatch'] &&
        (form.controls.confirmPassword.dirty || form.controls.confirmPassword.touched)
      ) {
        <span class="text-xs font-medium text-danger">
          Les mots de passe ne correspondent pas.
        </span>
      }
    </label>

    <label class="flex items-start gap-2">
      <input
        formControlName="acceptTerms"
        type="checkbox"
        class="mt-1 h-5 w-5 rounded border-line"
      />
      <span class="text-sm text-ink">
        J'accepte les <a routerLink="/cgu" class="underline">CGU</a> et la
        <a routerLink="/confidentialite" class="underline">politique de confidentialité</a>.
      </span>
    </label>

    <label class="flex items-start gap-2">
      <input
        formControlName="newsletterOptIn"
        type="checkbox"
        class="mt-1 h-5 w-5 rounded border-line"
      />
      <span class="text-sm text-ink">Je souhaite recevoir la newsletter FactureLe.</span>
    </label>

    <app-referral-code-prompt
      [prefillCode]="refCodeFromQuery"
      (codeConfirmed)="onReferralCodeConfirmed($event)"
    />

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Code de parrainage (facultatif)</span>
      <input
        formControlName="referralCode"
        type="text"
        placeholder="CODE-PARRAINAGE"
        class="rounded-lg border border-line px-4 py-3 uppercase text-ink"
      />
      @if (referralCodeValid() === true) {
        <span class="text-xs font-medium text-success">
          Code valide — vous bénéficierez de 5 € de réduction sur votre premier mois d'abonnement
          (15 € → 10 €).
        </span>
      } @else if (referralCodeValid() === false) {
        <span class="text-xs font-medium text-danger">Code inconnu — vérifiez la saisie.</span>
      }
    </label>

    @if (errorMessage(); as message) {
      <p class="text-center font-medium text-danger">{{ message }}</p>
    }

    <app-big-button type="submit" [disabled]="saving()">
      {{ saving() ? 'Création…' : 'Créer mon compte' }}
    </app-big-button>
  </form>

  @if (!platformService.isIosApp()) {
    <!-- Apple 4.8: see login.page.html's identical note. -->
    <a
      [href]="googleLoginUrl"
      class="flex items-center justify-center gap-2 rounded-xl border border-line px-6 py-3 text-sm font-semibold text-ink hover:bg-secondary-subtle"
    >
      Continuer avec Google
    </a>
  }

  <p class="text-center text-sm text-ink-soft">
    Déjà un compte ?
    <a routerLink="/connexion" class="font-medium underline">Se connecter</a>
  </p>
</div>
