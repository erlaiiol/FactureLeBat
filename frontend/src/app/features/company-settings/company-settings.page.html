<!-- "Atelier sobre" (docs/design-system.md): one of the three sanctioned
     accent-only spots — this section speaks about the artisan's business
     identity (name, SIRET, legal status), not fast transactional data
     entry, so it's the deliberate exception to "never on a data-entry
     screen". -->
<section class="bg-atelier-bg text-atelier-ink font-atelier-sans rounded-2xl p-6">
  <h1 class="font-atelier-heading mb-6 text-3xl font-semibold">Mon activité</h1>

  @if (loading()) {
    <p class="text-atelier-ink-soft">Chargement…</p>
  }

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="flex flex-col gap-4"
    [class.hidden]="loading()"
  >
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-atelier-ink-soft">Nom de l'entreprise</span>
      <input
        formControlName="name"
        type="text"
        class="rounded-lg border border-[var(--color-atelier-walnut)]/25 bg-atelier-surface px-4 py-3 text-lg text-atelier-ink"
      />
      <app-field-hint text="Le nom affiché en haut de chaque facture." />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-atelier-ink-soft">SIRET (14 chiffres)</span>
      <input
        formControlName="siret"
        type="text"
        inputmode="numeric"
        maxlength="14"
        class="rounded-lg border border-[var(--color-atelier-walnut)]/25 bg-atelier-surface px-4 py-3 text-lg text-atelier-ink"
      />
      <app-field-hint text="Votre numéro d'identification légal — obligatoire sur toute facture." />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-atelier-ink-soft">Adresse</span>
      <input
        formControlName="addressLine1"
        type="text"
        class="rounded-lg border border-[var(--color-atelier-walnut)]/25 bg-atelier-surface px-4 py-3 text-lg text-atelier-ink"
      />
      <app-field-hint text="L'adresse de votre entreprise, affichée sur vos factures." />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-atelier-ink-soft">Complément d'adresse</span>
      <input
        formControlName="addressLine2"
        type="text"
        class="rounded-lg border border-[var(--color-atelier-walnut)]/25 bg-atelier-surface px-4 py-3 text-lg text-atelier-ink"
      />
      <app-field-hint text="Facultatif — bâtiment, étage, zone d'activité…" />
    </label>

    <div class="flex gap-4">
      <label class="flex flex-1 flex-col gap-1">
        <span class="text-sm font-medium text-atelier-ink-soft">Code postal</span>
        <input
          formControlName="postalCode"
          type="text"
          class="rounded-lg border border-[var(--color-atelier-walnut)]/25 bg-atelier-surface px-4 py-3 text-lg text-atelier-ink"
        />
        <app-field-hint text="Le code postal de votre entreprise." />
      </label>
      <label class="flex flex-[2] flex-col gap-1">
        <span class="text-sm font-medium text-atelier-ink-soft">Ville</span>
        <input
          formControlName="city"
          type="text"
          class="rounded-lg border border-[var(--color-atelier-walnut)]/25 bg-atelier-surface px-4 py-3 text-lg text-atelier-ink"
        />
        <app-field-hint text="La ville de votre entreprise." />
      </label>
    </div>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-atelier-ink-soft">Email</span>
      <input
        formControlName="email"
        type="email"
        class="rounded-lg border border-[var(--color-atelier-walnut)]/25 bg-atelier-surface px-4 py-3 text-lg text-atelier-ink"
      />
      <app-field-hint text="Facultatif — affiché sur vos factures pour vous contacter." />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-atelier-ink-soft">Téléphone</span>
      <input
        formControlName="phone"
        type="tel"
        class="rounded-lg border border-[var(--color-atelier-walnut)]/25 bg-atelier-surface px-4 py-3 text-lg text-atelier-ink"
      />
      <app-field-hint text="Facultatif — affiché sur vos factures pour vous contacter." />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-atelier-ink-soft">Statut</span>
      <select
        formControlName="legalStatus"
        class="rounded-lg border border-[var(--color-atelier-walnut)]/25 bg-atelier-surface px-4 py-3 text-lg text-atelier-ink"
      >
        <option value="MICRO_ENTREPRENEUR">Micro-entrepreneur (sans TVA)</option>
        <option value="COMPANY">Entreprise (avec TVA)</option>
      </select>
      <app-field-hint
        text="Détermine si la TVA s'applique automatiquement sur vos futures factures."
      />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-atelier-ink-soft">Taux de TVA (%)</span>
      <input
        formControlName="vatRatePercent"
        type="number"
        step="0.1"
        class="rounded-lg border border-[var(--color-atelier-walnut)]/25 bg-atelier-surface px-4 py-3 text-lg text-atelier-ink"
      />
      <app-field-hint text="Utilisé uniquement si votre statut applique la TVA." />
    </label>

    <button
      type="submit"
      [disabled]="saving()"
      class="w-full rounded-xl bg-[var(--color-atelier-walnut)] px-6 py-4 text-lg font-semibold text-[var(--color-atelier-surface)] shadow-sm transition hover:brightness-95 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
    </button>

    @if (saved()) {
      <p class="text-center font-medium text-[var(--color-atelier-moss)]">Enregistré !</p>
    }
    @if (errorMessage(); as message) {
      <p class="text-center font-medium text-danger">{{ message }}</p>
    }
  </form>
</section>

<section class="mt-8 flex flex-col gap-3 rounded-xl border border-line bg-surface p-4">
  <h2 class="font-heading uppercase tracking-wide text-lg font-semibold text-ink">
    Visites guidées
  </h2>

  <label class="flex items-center gap-2">
    <input
      type="checkbox"
      class="h-5 w-5"
      [checked]="tourService.tourEnabled()"
      (change)="onTourEnabledChange($any($event.target).checked)"
    />
    <span class="text-sm font-medium text-ink">Activer les visites guidées</span>
  </label>
  <app-field-hint
    text="Affiche une courte visite guidée la première fois que vous ouvrez chaque section de l'application."
  />

  <app-big-button
    variant="secondary"
    tone="subtle"
    [disabled]="!tourService.tourEnabled()"
    (click)="replayTours()"
  >
    Rejouer les visites guidées
  </app-big-button>
  @if (toursReplayed()) {
    <p class="text-center font-medium text-success">
      Visites réinitialisées ! Elles réapparaîtront à votre prochaine visite de chaque section.
    </p>
  }
</section>
