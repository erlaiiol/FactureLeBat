<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="flex flex-col gap-3 rounded-xl border border-info-subtle-border bg-info-subtle/30 p-4"
>
  <span class="font-heading text-sm font-semibold tracking-wide text-ink uppercase">
    Nouvelle prestation
  </span>

  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Nom</span>
    <input
      formControlName="name"
      type="text"
      placeholder="Ex : Main-d’œuvre pose parquet"
      class="rounded-lg border border-line px-4 py-3 text-lg"
    />
  </label>

  <div class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Tarification</span>
    <div class="flex overflow-hidden rounded-lg border border-line">
      <button
        type="button"
        (click)="setPricingMode('FIXED')"
        [class.bg-info]="!isPercentageMode()"
        [class.text-info-fg]="!isPercentageMode()"
        class="flex-1 px-4 py-3 text-sm font-semibold"
      >
        Prix fixe
      </button>
      <button
        type="button"
        (click)="setPricingMode('PERCENTAGE')"
        [class.bg-info]="isPercentageMode()"
        [class.text-info-fg]="isPercentageMode()"
        class="flex-1 px-4 py-3 text-sm font-semibold"
      >
        Pourcentage
      </button>
    </div>
  </div>

  @if (!isPercentageMode()) {
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Prix (€)</span>
      <input
        formControlName="priceEuros"
        type="number"
        step="0.01"
        min="0"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      />
    </label>
  } @else {
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Pourcentage (%)</span>
      <input
        formControlName="percentage"
        type="number"
        step="0.01"
        min="0.01"
        max="100"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      />
      <app-field-hint
        text="Ex : « Marge 30% », réutilisable sur chaque facture — calculé automatiquement, plus besoin de le recalculer à la main."
      />
    </label>
  }

  <button
    type="button"
    (click)="toggleAllFields()"
    class="text-left text-sm font-medium text-info underline"
  >
    {{ showAllFields() ? 'Réduire' : 'Afficher tout / Compléter la fiche' }}
  </button>

  @if (showAllFields()) {
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Description</span>
      <textarea
        formControlName="description"
        rows="2"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      ></textarea>
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Code prestation</span>
      <input
        formControlName="code"
        type="text"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Visibilité par défaut</span>
      <select
        formControlName="defaultVisibility"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      >
        <option value="VISIBLE">Visible — sa propre ligne sur la facture</option>
        <option value="REDISTRIBUTED">Répartie — masquée, ajoutée aux autres lignes</option>
      </select>
    </label>
  }

  @if (errorMessage(); as message) {
    <p class="text-center font-medium text-danger">{{ message }}</p>
  }

  <div class="flex gap-3">
    <div class="flex-1">
      <app-big-button type="submit" [disabled]="saving()">
        {{ saving() ? 'Création…' : 'Créer et ajouter' }}
      </app-big-button>
    </div>
    <div class="flex-1">
      <app-big-button variant="secondary" tone="subtle" type="button" (click)="cancel.emit()">
        Annuler
      </app-big-button>
    </div>
  </div>
</form>
