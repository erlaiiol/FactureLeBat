<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="flex flex-col gap-3 rounded-xl border border-primary-subtle-border bg-primary-subtle/30 p-4"
>
  <span class="font-heading text-sm font-semibold tracking-wide text-ink uppercase">
    Nouveau produit
  </span>

  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Nom</span>
    <input
      formControlName="name"
      type="text"
      placeholder="Ex : Parquet chêne massif"
      class="rounded-lg border border-line px-4 py-3 text-lg"
    />
  </label>

  <div class="flex gap-3">
    <label class="flex flex-1 flex-col gap-1">
      <span class="text-sm font-medium text-ink">Unité</span>
      <select formControlName="unit" class="rounded-lg border border-line px-4 py-3 text-lg">
        @for (option of unitOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>
    <label class="flex flex-1 flex-col gap-1">
      <span class="text-sm font-medium text-ink">Prix (€)</span>
      <input
        formControlName="priceEuros"
        type="number"
        step="0.01"
        min="0"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      />
    </label>
  </div>

  <button
    type="button"
    (click)="toggleAllFields()"
    class="text-left text-sm font-medium text-primary underline"
  >
    {{ showAllFields() ? 'Réduire' : 'Afficher tout / Compléter la fiche' }}
  </button>

  @if (showAllFields()) {
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Description</span>
      <textarea
        formControlName="description"
        rows="2"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      ></textarea>
    </label>

    <div class="flex gap-3">
      <label class="flex flex-1 flex-col gap-1">
        <span class="text-sm font-medium text-ink">Fournisseur</span>
        <input
          formControlName="supplierName"
          type="text"
          class="rounded-lg border border-line px-4 py-3 text-lg"
        />
      </label>
      <label class="flex flex-1 flex-col gap-1">
        <span class="text-sm font-medium text-ink">URL fournisseur</span>
        <input
          formControlName="supplierUrl"
          type="url"
          class="rounded-lg border border-line px-4 py-3 text-lg"
        />
      </label>
    </div>

    <div class="flex gap-3">
      <label class="flex flex-1 flex-col gap-1">
        <span class="text-sm font-medium text-ink">Code produit</span>
        <input
          formControlName="code"
          type="text"
          class="rounded-lg border border-line px-4 py-3 text-lg"
        />
      </label>
      <label class="flex flex-1 flex-col gap-1">
        <span class="text-sm font-medium text-ink">Quantité par conditionnement</span>
        <input
          formControlName="packagingQuantity"
          type="number"
          step="0.001"
          min="0"
          class="rounded-lg border border-line px-4 py-3 text-lg"
        />
        <app-field-hint text="Ex : 9 pour une boîte de 9 m²." />
      </label>
    </div>
  }

  @if (errorMessage(); as message) {
    <p class="text-center font-medium text-danger">{{ message }}</p>
  }

  <div class="flex gap-3">
    <div class="flex-1">
      <app-big-button type="submit" [disabled]="saving()">
        {{ saving() ? 'Création…' : 'Créer et ajouter' }}
      </app-big-button>
    </div>
    <div class="flex-1">
      <app-big-button variant="secondary" tone="subtle" type="button" (click)="cancel.emit()">
        Annuler
      </app-big-button>
    </div>
  </div>
</form>
