<div [formGroup]="group()" class="flex flex-col gap-3 rounded-xl border border-line p-4">
  <div class="flex items-center justify-between">
    <span class="font-semibold text-ink">Prestation {{ index() + 1 }}</span>
    <button
      type="button"
      (click)="remove.emit()"
      class="text-sm font-medium text-danger hover:underline"
    >
      Supprimer
    </button>
  </div>

  @if (services().length > 0 && !isCatalogLinked()) {
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Prestation enregistrée</span>
      <select
        (change)="onServiceSelected($any($event.target).value)"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      >
        <option value="">— Sélectionner —</option>
        @for (service of services(); track service.id) {
          <option [value]="service.id">{{ service.name }}</option>
        }
      </select>
    </label>
  }

  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Nom</span>
    <input
      formControlName="name"
      type="text"
      [readonly]="isCatalogLinked()"
      placeholder="Ex : Main-d’œuvre"
      class="rounded-lg border border-line px-4 py-3 text-lg"
      [class.bg-bg]="isCatalogLinked()"
      [class.text-ink-soft]="isCatalogLinked()"
    />
    @if (isCatalogLinked()) {
      <app-field-hint
        text="Cette prestation vient de votre catalogue — renommez-la depuis « Mes prestations » si besoin."
      />
    } @else {
      <app-field-hint text="Ce qui sera écrit sur la facture pour cette prestation." />
    }
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Mode de tarification</span>
    <select formControlName="pricingMode" class="rounded-lg border border-line px-4 py-3 text-lg">
      <option value="FIXED">Montant fixe</option>
      <option value="PERCENTAGE">Pourcentage du reste de la facture</option>
    </select>
    <app-field-hint
      text="Pourcentage : le montant de cette prestation est recalculé automatiquement à partir du total des autres lignes et prestations visibles de la facture."
    />
  </label>

  <div class="flex gap-3">
    @if (isPercentageMode()) {
      <div class="flex flex-1 flex-col gap-1">
        <span class="text-sm font-medium text-ink">Pourcentage (%)</span>
        <input
          type="number"
          step="0.01"
          min="0"
          max="100"
          [value]="displayPercentage()"
          (input)="onPercentageInput($any($event.target).value)"
          class="rounded-lg border border-line px-4 py-3 text-lg"
        />
        <app-field-hint
          text="Montant calculé automatiquement : {{
            resolvedAmountCents() / 100 | number: '1.2-2'
          }} €."
        />
      </div>
    } @else {
      <label class="flex flex-1 flex-col gap-1">
        <span class="text-sm font-medium text-ink">Montant (€)</span>
        <input
          formControlName="amountEuros"
          type="number"
          step="0.01"
          min="0"
          class="rounded-lg border border-line px-4 py-3 text-lg"
        />
        <app-field-hint text="Le montant total de cette prestation." />
      </label>
    }

    <label class="flex flex-1 flex-col gap-1">
      <span class="text-sm font-medium text-ink">Visibilité</span>
      <select formControlName="visibility" class="rounded-lg border border-line px-4 py-3 text-lg">
        <option value="VISIBLE">Visible</option>
        <option value="REDISTRIBUTED">Répartie</option>
      </select>
      <app-field-hint
        text="Visible : sa propre ligne sur la facture. Répartie : le montant est ajouté aux autres lignes, sans apparaître seul."
      />
    </label>
  </div>

  @if (isRedistributed()) {
    <app-line-badge>Réparti sur les lignes</app-line-badge>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Type de répartition</span>
      <select
        formControlName="redistributionStrategy"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      >
        <option value="EQUAL">Égale entre toutes les lignes</option>
        <option value="WEIGHTED">Personnalisée (poids par ligne)</option>
      </select>
      <app-field-hint text="Comment le montant est réparti entre les lignes de la facture." />
    </label>

    @if (isWeighted()) {
      <div formArrayName="weights" class="flex flex-col gap-2 rounded-lg bg-bg p-3">
        <span class="text-sm font-medium text-ink">Poids par ligne</span>
        @for (weightControl of weightControls(); track $index) {
          <label class="flex items-center justify-between gap-3">
            <span class="text-sm text-ink-soft">
              {{ lineLabels()[$index] || 'Ligne ' + ($index + 1) }}
            </span>
            <input
              [formControlName]="$index"
              type="number"
              min="0"
              step="1"
              class="w-24 rounded-lg border border-line px-3 py-2 text-right"
            />
          </label>
        }
        <app-field-hint
          text="Plus le poids d'une ligne est élevé, plus elle reçoit une grande part du montant."
        />
      </div>
    }
  } @else {
    <app-field-hint text="Cette prestation aura sa propre ligne sur la facture." />
  }

  <!-- Phase 13.5 gallery redesign: see InvoiceLineFormComponent's ng-content
       for why this exists — the page's "Valider" button lives inside this
       card's own border, next to the catalog-save toggle. -->
  <div class="flex gap-3">
    <button
      type="button"
      (click)="toggleSaveToCatalog()"
      class="flex-1 rounded-xl border px-4 py-4 text-sm font-semibold shadow-sm transition"
      [class.border-info-subtle-border]="!group().controls.saveAsNewService.value"
      [class.bg-info-subtle]="!group().controls.saveAsNewService.value"
      [class.text-info-subtle-fg]="!group().controls.saveAsNewService.value"
      [class.border-info]="group().controls.saveAsNewService.value"
      [class.bg-info]="group().controls.saveAsNewService.value"
      [class.text-info-fg]="group().controls.saveAsNewService.value"
    >
      @if (group().controls.saveAsNewService.value) {
        <app-icon-check [size]="14" />
      }
      {{ saveToCatalogLabel() }}
    </button>
    <div class="flex-1">
      <ng-content />
    </div>
  </div>
</div>
