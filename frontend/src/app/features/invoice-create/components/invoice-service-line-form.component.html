<div [formGroup]="group()" class="flex flex-col gap-3 rounded-xl border border-slate-200 p-4">
  <div class="flex items-center justify-between">
    <span class="font-semibold text-slate-700">Prestation {{ index() + 1 }}</span>
    <button
      type="button"
      (click)="remove.emit()"
      class="text-sm font-medium text-red-600 hover:underline"
    >
      Supprimer
    </button>
  </div>

  @if (services().length > 0) {
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">Prestation enregistrée</span>
      <select
        (change)="onServiceSelected($any($event.target).value)"
        class="rounded-lg border border-slate-300 px-4 py-3 text-lg"
      >
        <option value="">— Sélectionner —</option>
        @for (service of services(); track service.id) {
          <option [value]="service.id">{{ service.name }}</option>
        }
      </select>
    </label>
  }

  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-slate-700">Nom</span>
    <input
      formControlName="name"
      type="text"
      placeholder="Ex : Main-d’œuvre"
      class="rounded-lg border border-slate-300 px-4 py-3 text-lg"
    />
    <app-field-hint text="Ce qui sera écrit sur la facture pour cette prestation." />
  </label>

  <div class="flex gap-3">
    <label class="flex flex-1 flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">Montant (€)</span>
      <input
        formControlName="amountEuros"
        type="number"
        step="0.01"
        min="0"
        class="rounded-lg border border-slate-300 px-4 py-3 text-lg"
      />
      <app-field-hint text="Le montant total de cette prestation." />
    </label>

    <label class="flex flex-1 flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">Visibilité</span>
      <select
        formControlName="visibility"
        class="rounded-lg border border-slate-300 px-4 py-3 text-lg"
      >
        <option value="VISIBLE">Visible</option>
        <option value="REDISTRIBUTED">Répartie</option>
      </select>
      <app-field-hint
        text="Visible : sa propre ligne sur la facture. Répartie : le montant est ajouté aux autres lignes, sans apparaître seul."
      />
    </label>
  </div>

  @if (isRedistributed()) {
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">Type de répartition</span>
      <select
        formControlName="redistributionStrategy"
        class="rounded-lg border border-slate-300 px-4 py-3 text-lg"
      >
        <option value="EQUAL">Égale entre toutes les lignes</option>
        <option value="WEIGHTED">Personnalisée (poids par ligne)</option>
      </select>
      <app-field-hint text="Comment le montant est réparti entre les lignes de la facture." />
    </label>

    @if (isWeighted()) {
      <div formArrayName="weights" class="flex flex-col gap-2 rounded-lg bg-slate-50 p-3">
        <span class="text-sm font-medium text-slate-700">Poids par ligne</span>
        @for (weightControl of weightControls(); track $index) {
          <label class="flex items-center justify-between gap-3">
            <span class="text-sm text-slate-600">
              {{ lineLabels()[$index] || 'Ligne ' + ($index + 1) }}
            </span>
            <input
              [formControlName]="$index"
              type="number"
              min="0"
              step="1"
              class="w-24 rounded-lg border border-slate-300 px-3 py-2 text-right"
            />
          </label>
        }
        <app-field-hint
          text="Plus le poids d'une ligne est élevé, plus elle reçoit une grande part du montant."
        />
      </div>
    }
  } @else {
    <app-field-hint text="Cette prestation aura sa propre ligne sur la facture." />
  }
</div>
