<div [formGroup]="group()" class="flex flex-col gap-3 rounded-xl border border-slate-200 p-4">
  <div class="flex items-center justify-between">
    <span class="font-semibold text-slate-700">Ligne {{ index() + 1 }}</span>
    <button
      type="button"
      (click)="remove.emit()"
      class="text-sm font-medium text-red-600 hover:underline"
    >
      Supprimer
    </button>
  </div>

  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-slate-700">Description</span>
    <input
      formControlName="description"
      type="text"
      placeholder="Ex : Parquet chêne massif posé"
      class="rounded-lg border border-slate-300 px-4 py-3 text-lg"
    />
    <app-field-hint text="Ce qui sera écrit sur la facture pour cette ligne." />
  </label>

  <div class="flex gap-3">
    <label class="flex flex-1 flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">Unité</span>
      <select formControlName="unit" class="rounded-lg border border-slate-300 px-4 py-3 text-lg">
        @for (option of unitOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
      <app-field-hint
        text="Le m² active automatiquement le calcul de surface (avec chutes en option)."
      />
    </label>

    <label class="flex flex-1 flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">
        {{ isAreaMode() ? 'Surface du chantier (m²)' : 'Quantité du chantier' }}
      </span>
      <input
        formControlName="quantity"
        type="number"
        step="0.01"
        class="rounded-lg border border-slate-300 px-4 py-3 text-lg"
      />
      <app-field-hint
        [text]="
          isAreaMode()
            ? 'Ce dont le chantier a besoin, chutes non comprises — pas forcément ce qui sera facturé.'
            : 'Ce dont le chantier a besoin — pas forcément ce qui sera facturé.'
        "
      />
    </label>
  </div>

  <div class="flex gap-3">
    <label class="flex flex-1 flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">Prix unitaire (€)</span>
      <input
        formControlName="unitPriceEuros"
        type="number"
        step="0.01"
        class="rounded-lg border border-slate-300 px-4 py-3 text-lg"
      />
      <app-field-hint text="Le prix pour une seule unité, hors chutes éventuelles." />
    </label>

    @if (isAreaMode()) {
      <label class="flex flex-1 flex-col gap-1">
        <span class="text-sm font-medium text-slate-700">Chutes (matière en plus)</span>
        <select
          formControlName="wasteSurcharge"
          class="rounded-lg border border-slate-300 px-4 py-3 text-lg"
        >
          <option value="NONE">Aucune</option>
          <option value="TEN">+10 %</option>
          <option value="TWENTY">+20 %</option>
        </select>
        <app-field-hint
          text="Ajoute automatiquement de la matière facturée pour compenser les découpes perdues."
        />
      </label>
    }
  </div>

  <div class="flex gap-3">
    <label class="flex flex-1 flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">Conditionnement</span>
      <input
        formControlName="packagingQuantity"
        type="number"
        step="0.001"
        min="0"
        [placeholder]="'Ex : 9 ' + unitLabels[group().controls.unit.value] + ' par boîte'"
        class="rounded-lg border border-slate-300 px-4 py-3 text-lg"
      />
      <app-field-hint
        text="Facultatif — si ce produit se vend en colis fixe (boîte, sac, rouleau…), indiquez la quantité par colis pour que la quantité facturée soit arrondie automatiquement."
      />
    </label>

    @if (hasPackaging()) {
      <label class="flex flex-1 flex-row items-center gap-2 pt-6">
        <input formControlName="roundUpToPackaging" type="checkbox" class="h-5 w-5" />
        <span class="text-sm font-medium text-slate-700">
          Arrondir au conditionnement (facturer des colis entiers)
        </span>
      </label>
    }
  </div>
</div>
