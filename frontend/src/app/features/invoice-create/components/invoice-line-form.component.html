<div [formGroup]="group()" class="flex flex-col gap-3 rounded-xl border border-line p-4">
  <div class="flex items-center justify-between">
    <span class="font-semibold text-ink">Ligne {{ index() + 1 }}</span>
    <button
      type="button"
      (click)="remove.emit()"
      class="text-sm font-medium text-danger hover:underline"
    >
      Supprimer
    </button>
  </div>

  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Description</span>
    <input
      formControlName="description"
      type="text"
      [readonly]="isCatalogLinked()"
      placeholder="Ex : Parquet chêne massif posé"
      class="rounded-lg border border-line px-4 py-3 text-lg"
      [class.bg-bg]="isCatalogLinked()"
      [class.text-ink-soft]="isCatalogLinked()"
    />
    @if (isCatalogLinked()) {
      <app-field-hint
        text="Ce produit vient de votre catalogue — renommez-le depuis « Mes produits » si besoin."
      />
    } @else {
      <app-field-hint text="Ce qui sera écrit sur la facture pour cette ligne." />
    }
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-ink">Code produit</span>
    <input
      formControlName="productCode"
      type="text"
      placeholder="Ex : UC204850"
      class="rounded-lg border border-line px-4 py-3 text-lg"
    />
    <app-field-hint text="Facultatif — la référence de ce produit chez votre fournisseur." />
  </label>

  <div class="flex gap-3">
    <label class="flex flex-1 flex-col gap-1">
      <span class="text-sm font-medium text-ink">Unité</span>
      <select formControlName="unit" class="rounded-lg border border-line px-4 py-3 text-lg">
        @for (option of unitOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
      <app-field-hint
        text="Le m² active automatiquement le calcul de surface (avec chutes en option)."
      />
    </label>

    <label class="flex flex-1 flex-col gap-1">
      <span class="text-sm font-medium text-ink">
        {{ isAreaMode() ? 'Surface du chantier (m²)' : 'Quantité du chantier' }}
      </span>
      <input
        formControlName="quantity"
        type="number"
        step="0.01"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      />
      <app-field-hint
        [text]="
          isAreaMode()
            ? 'Ce dont le chantier a réellement besoin, chutes non comprises — la quantité facturée peut être plus grande, voir le récapitulatif en bas de ligne.'
            : 'Ce dont le chantier a besoin — la quantité facturée peut différer, voir le récapitulatif en bas de ligne.'
        "
      />
    </label>
  </div>

  @if (isAreaMode()) {
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">Chutes (matière en plus)</span>
      <select
        formControlName="wasteSurcharge"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      >
        <option value="NONE">Aucune</option>
        <option value="TEN">+10 %</option>
        <option value="TWENTY">+20 %</option>
      </select>
      <app-field-hint
        text="Ajoute de la matière à couvrir pour compenser les découpes perdues, avant l'éventuel arrondi au conditionnement ci-dessous."
      />
    </label>
  }

  <div class="flex flex-col gap-3 rounded-lg border border-line p-3">
    <span class="text-sm font-semibold text-ink">Prix du matériau</span>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-ink">{{ unitPriceButtonLabel() }} (€)</span>
      <input
        formControlName="unitPriceEuros"
        type="number"
        step="0.01"
        class="rounded-lg border border-line px-4 py-3 text-lg"
      />
    </label>

    @if (packagingEnabled()) {
      <div class="flex flex-col gap-3 rounded-lg border border-line bg-bg p-3">
        <div class="flex items-center justify-between">
          <span class="text-sm font-semibold text-ink">Vendu par conditionnement</span>
          <button
            type="button"
            (click)="disablePackaging()"
            class="text-xs font-medium text-ink-soft hover:underline"
          >
            Revenir à un prix simple
          </button>
        </div>

        <div class="flex gap-3">
          <label class="flex flex-1 flex-col gap-1">
            <span class="text-sm font-medium text-ink">
              Combien d'unités dans un conditionnement ?
            </span>
            <input
              type="number"
              step="1"
              min="0"
              [value]="packagingItemCount() ?? ''"
              placeholder="Ex : 8 (planches)"
              (input)="onPackagingItemCountInput($any($event.target).value)"
              class="rounded-lg border border-line px-4 py-3 text-lg"
            />
          </label>
          <label class="flex flex-1 flex-col gap-1">
            <span class="text-sm font-medium text-ink">
              Soit combien de {{ unitLabels[group().controls.unit.value] }} au total ?
            </span>
            <input
              formControlName="packagingQuantity"
              type="number"
              step="0.001"
              min="0"
              placeholder="Ex : 2,4"
              class="rounded-lg border border-line px-4 py-3 text-lg"
            />
          </label>
        </div>
        <app-field-hint
          [text]="
            'Ex : une boîte de 8 planches, soit 2,4 ' +
            unitLabels[group().controls.unit.value] +
            ' au total — cette seconde valeur sert à arrondir la facturation par lot entier ci-dessous. Le nombre d\'unités est facultatif, juste pour vérifier votre compte.'
          "
        />

        <label class="flex flex-row items-center gap-2">
          <input
            formControlName="roundUpToPackaging"
            type="checkbox"
            [disabled]="!hasPackaging()"
            class="h-5 w-5"
          />
          <span
            class="text-sm font-medium"
            [class.text-ink]="hasPackaging()"
            [class.text-ink-soft]="!hasPackaging()"
          >
            Facturer des conditionnements entiers (arrondir au lot)
          </span>
        </label>
      </div>
    } @else {
      <button
        type="button"
        (click)="enablePackaging()"
        class="self-start text-sm font-medium text-primary hover:underline"
      >
        + Vendu par conditionnement (boîte, palette...)
      </button>
    }
  </div>

  <app-field-hint
    text="Seules les infos réutilisables (nom, unité, prix, conditionnement, code) sont enregistrées — la quantité et l'arrondi restent propres à ce chantier."
  />

  <div class="rounded-lg border border-line bg-bg p-3 text-sm text-ink">
    {{ quantitySummary() }}
  </div>

  @if (showSourcingPanel()) {
    <app-sourcing-panel
      [productName]="group().controls.description.value"
      [quantity]="group().controls.quantity.value"
      [unit]="group().controls.unit.value"
      [customerLocation]="customerLocation()"
    />
  }

  <!-- Phase 13.5 gallery redesign: lets the lines-step page put its
       "Valider" button inside this card's own border instead of floating
       below it as a separate element. The catalog-save toggle sits right
       next to it, much bigger than the checkbox it replaces, since it's the
       one decision ("one-off line" vs "goes in my catalogue") every line
       actually needs the artisan to make. -->
  <div class="flex gap-3">
    <button
      type="button"
      (click)="toggleSaveToCatalog()"
      class="flex-1 rounded-xl border px-4 py-4 text-sm font-semibold shadow-sm transition"
      [class.border-primary-subtle-border]="!group().controls.saveAsNewProduct.value"
      [class.bg-primary-subtle]="!group().controls.saveAsNewProduct.value"
      [class.text-primary-subtle-fg]="!group().controls.saveAsNewProduct.value"
      [class.border-primary]="group().controls.saveAsNewProduct.value"
      [class.bg-primary]="group().controls.saveAsNewProduct.value"
      [class.text-primary-fg]="group().controls.saveAsNewProduct.value"
    >
      @if (group().controls.saveAsNewProduct.value) {
        ✓
      }
      {{ saveToCatalogLabel() }}
    </button>
    <div class="flex-1">
      <ng-content />
    </div>
  </div>
</div>
