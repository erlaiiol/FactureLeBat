<div class="mx-auto flex max-w-2xl flex-col gap-6 pb-44">
  <nav class="flex items-center justify-between gap-2 text-sm font-medium">
    <div class="flex gap-2">
      <a
        routerLink="client"
        routerLinkActive="bg-primary !text-primary-fg"
        class="rounded-full bg-secondary-subtle px-4 py-2 text-ink"
      >
        1. Client
      </a>
      <a
        routerLink="lignes"
        routerLinkActive="bg-primary !text-primary-fg"
        class="rounded-full bg-secondary-subtle px-4 py-2 text-ink"
      >
        2. Lignes &amp; prestations
      </a>
      <a
        routerLink="apercu"
        routerLinkActive="bg-primary !text-primary-fg"
        class="rounded-full bg-secondary-subtle px-4 py-2 text-ink"
      >
        3. Aperçu
      </a>
    </div>
    <button
      type="button"
      (click)="resetDraft()"
      class="rounded-full border border-danger-subtle-border bg-danger-subtle px-3 py-2 text-danger hover:brightness-95"
      aria-label="Vider la facture et recommencer"
      title="Vider la facture et recommencer"
    >
      <app-icon-trash [size]="18" />
    </button>
  </nav>

  <router-outlet />
</div>

<div class="fixed inset-x-0 bottom-0 z-10 border-t border-line bg-surface p-4 shadow-lg">
  <div class="mx-auto flex max-w-2xl flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <app-invoice-totals-summary
      appTourAnchor="invoice-total"
      [totals]="draftStore.totalsPreview()"
      [vatApplicable]="draftStore.vatApplicable()"
    />
    @if (!isOnPreviewStep()) {
      <div class="w-full sm:w-64">
        <app-big-button
          variant="secondary"
          tone="subtle"
          appTourAnchor="invoice-preview"
          [disabled]="!draftStore.canPreview()"
          (click)="goToPreview()"
        >
          Aperçu de la facture
        </app-big-button>
      </div>
    }
  </div>
</div>
