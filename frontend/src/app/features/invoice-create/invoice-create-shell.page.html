<div class="mx-auto flex max-w-2xl flex-col gap-6 pb-44">
  <nav class="flex gap-2 text-sm font-medium">
    <a
      routerLink="client"
      routerLinkActive="bg-blue-600 text-white"
      class="rounded-full bg-slate-100 px-4 py-2 text-slate-700"
    >
      1. Client
    </a>
    <a
      routerLink="lignes"
      routerLinkActive="bg-blue-600 text-white"
      class="rounded-full bg-slate-100 px-4 py-2 text-slate-700"
    >
      2. Lignes &amp; prestations
    </a>
  </nav>

  <router-outlet />
</div>

<div class="fixed inset-x-0 bottom-0 z-10 border-t border-slate-200 bg-white p-4 shadow-lg">
  <div class="mx-auto flex max-w-2xl flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <app-invoice-totals-summary
      appTourAnchor="invoice-total"
      [totals]="draftStore.totalsPreview()"
      [vatApplicable]="draftStore.vatApplicable()"
    />
    <div class="w-full sm:w-64">
      @if (previewError(); as message) {
        <p class="mb-2 text-center text-sm font-medium text-red-700">{{ message }}</p>
      }
      <app-big-button
        variant="secondary"
        appTourAnchor="invoice-preview"
        [disabled]="previewing() || !draftStore.canPreview()"
        (click)="preview()"
      >
        {{ previewing() ? 'Génération…' : 'Aperçu de la facture' }}
      </app-big-button>
    </div>
  </div>
</div>
