@if (invoice(); as invoice) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-ink/70 p-4"
    role="dialog"
    aria-modal="true"
    aria-label="Signature du document"
    (click)="closed.emit()"
  >
    <div
      class="flex max-h-full max-w-lg flex-col rounded-2xl bg-surface shadow-2xl"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between border-b border-line p-4">
        <h2 class="font-heading uppercase tracking-wide text-lg font-bold text-ink">
          Signature — {{ invoice.number }}
        </h2>
        <button
          type="button"
          (click)="closed.emit()"
          class="rounded-lg px-3 py-2 text-ink-soft hover:bg-secondary-subtle"
          aria-label="Fermer"
        >
          <app-icon-close [size]="18" />
        </button>
      </div>
      <div class="overflow-y-auto p-4">
        <img
          [src]="imageUrl()"
          alt="Signature"
          class="max-h-[70vh] w-full rounded-lg bg-white object-contain"
        />
      </div>
    </div>
  </div>
}
