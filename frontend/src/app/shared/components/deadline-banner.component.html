@if (showEmission()) {
  <p
    class="bg-danger-subtle text-danger-subtle-fg mb-6 flex items-start justify-between gap-2 rounded-lg px-3 py-2 text-sm"
  >
    <span>
      <span class="font-medium">Envoyer vos factures par voie électronique</span>
      devient obligatoire le 1ᵉʳ septembre 2027
      @if (emission.daysLeft >= 0) {
        — plus que {{ emission.daysLeft }} jour{{ emission.daysLeft > 1 ? 's' : '' }}.
      } @else {
        — échéance dépassée.
      }
      <a routerLink="/entreprise" class="font-medium underline hover:opacity-80">Configurer →</a>
    </span>
    <button
      type="button"
      (click)="dismissEmission()"
      class="shrink-0 text-xs font-medium underline opacity-80 hover:opacity-100"
      aria-label="Masquer ce rappel"
    >
      Masquer
    </button>
  </p>
}
