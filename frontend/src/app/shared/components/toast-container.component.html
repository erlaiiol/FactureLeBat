<!-- bottom reads the `--invoice-footer-height` CSS variable (published by
     InvoiceCreateShellPage/InvoiceCreateManualPage) rather than a flat
     bottom-4: those pages' own fixed totals/preview bar sits at the exact
     same viewport edge, and a flat offset let toasts land inside that bar's
     opaque footprint instead of above it, even though z-50 already painted
     them on top — same `--nav-height` pattern as app.html's #topBar, just
     for the bottom edge. Falls back to 0px on every other page. -->
<div
  class="pointer-events-none fixed inset-x-4 bottom-[calc(var(--invoice-footer-height,0px)_+_1rem)] z-50 flex flex-col items-center gap-2 sm:inset-x-auto sm:right-4 sm:items-end"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="anim-line-in pointer-events-auto flex w-full max-w-sm items-center justify-between gap-3 rounded-lg border px-4 py-3 text-sm font-medium shadow-sm"
      [class]="variantClasses(toast.variant)"
      role="status"
    >
      <span>{{ toast.message }}</span>
      <button
        type="button"
        (click)="toastService.dismiss(toast.id)"
        class="shrink-0 text-lg leading-none opacity-70 hover:opacity-100"
        aria-label="Fermer"
      >
        &times;
      </button>
    </div>
  }
</div>
