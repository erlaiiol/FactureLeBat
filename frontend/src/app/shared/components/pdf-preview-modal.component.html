@if (pdfBlobUrl(); as url) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 p-4"
    role="dialog"
    aria-modal="true"
    aria-label="Aperçu de la facture"
    (click)="closed.emit()"
  >
    <div
      class="flex h-full w-full max-w-3xl flex-col rounded-2xl bg-white shadow-2xl"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between border-b border-slate-200 p-4">
        <h2 class="text-lg font-bold text-slate-900">Aperçu de la facture</h2>
        <button
          type="button"
          (click)="closed.emit()"
          class="rounded-lg px-3 py-2 text-xl leading-none text-slate-500 hover:bg-slate-100"
          aria-label="Fermer l'aperçu"
        >
          ✕
        </button>
      </div>
      <iframe
        [src]="safeUrl()"
        class="min-h-0 flex-1 rounded-b-2xl"
        title="Aperçu PDF de la facture"
      >
      </iframe>
    </div>
  </div>
}
