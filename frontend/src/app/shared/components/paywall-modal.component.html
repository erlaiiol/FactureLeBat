@if (paywallService.visible()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-ink/70 p-4"
    role="dialog"
    aria-modal="true"
    aria-label="Abonnement requis"
    (click)="paywallService.dismiss()"
  >
    <div
      class="flex w-full max-w-md flex-col gap-4 rounded-2xl bg-surface p-6 shadow-2xl"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-start justify-between gap-2">
        <h2 class="font-heading text-lg font-bold tracking-wide text-ink uppercase">
          Facture gratuite déjà utilisée
        </h2>
        <button
          type="button"
          (click)="paywallService.dismiss()"
          class="rounded-lg px-3 py-2 text-xl leading-none text-ink-soft hover:bg-secondary-subtle"
          aria-label="Fermer"
        >
          ✕
        </button>
      </div>
      <p class="text-ink-soft">
        Vous avez pu essayer FactureLeBat et configurer librement votre environnement (clients,
        produits, prestations). Pour créer de nouvelles factures, un abonnement est nécessaire.
      </p>
      <app-big-button variant="primary" tone="solid" (click)="goToSubscribe()">
        Voir les offres
      </app-big-button>
      <button
        type="button"
        (click)="paywallService.dismiss()"
        class="text-center text-sm font-medium text-ink-soft hover:underline"
      >
        Plus tard
      </button>
    </div>
  </div>
}
