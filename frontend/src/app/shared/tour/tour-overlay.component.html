@if (tourService.currentStep(); as step) {
  <div class="fixed inset-0 z-50" role="dialog" aria-modal="true" aria-live="polite">
    <svg class="pointer-events-none absolute inset-0 h-full w-full">
      <defs>
        <mask id="tour-spotlight-mask">
          <rect width="100%" height="100%" fill="white" />
          @if (targetRect(); as rect) {
            <rect
              [attr.x]="rect.left - 8"
              [attr.y]="rect.top - 8"
              [attr.width]="rect.width + 16"
              [attr.height]="rect.height + 16"
              rx="12"
              fill="black"
            />
          }
        </mask>
      </defs>
      <rect
        width="100%"
        height="100%"
        fill="rgba(15, 23, 42, 0.65)"
        mask="url(#tour-spotlight-mask)"
      />
    </svg>

    <div
      class="absolute w-80 max-w-[calc(100vw-24px)] rounded-2xl bg-white p-5 shadow-2xl transition-[top,left] duration-200"
      [style.top.px]="popoverPosition().top"
      [style.left.px]="popoverPosition().left"
    >
      <p class="mb-1 text-xs font-semibold tracking-wide text-blue-600 uppercase">
        Étape {{ tourService.stepIndex() + 1 }} / {{ tourService.stepCount() }}
      </p>
      <div class="mb-3 h-1.5 w-full overflow-hidden rounded-full bg-slate-100">
        <div
          class="h-full rounded-full bg-blue-600 transition-all duration-300"
          [style.width.%]="progressPercent()"
        ></div>
      </div>
      <h2 class="mb-1 text-lg font-bold text-slate-900">{{ step.title }}</h2>
      <p class="mb-4 text-sm text-slate-600">{{ step.body }}</p>
      <div class="flex items-center justify-end gap-2">
        @if (!tourService.isLastStep()) {
          <button
            type="button"
            class="rounded-lg px-3 py-2 text-sm font-medium text-slate-500 hover:bg-slate-100"
            (click)="tourService.skip()"
          >
            Passer
          </button>
        }
        <button
          type="button"
          class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-700"
          [class.animate-pulse]="tourService.isLastStep()"
          (click)="tourService.next()"
        >
          {{ tourService.isLastStep() ? '🎉 Terminer' : 'Suivant' }}
        </button>
      </div>
    </div>
  </div>
}
